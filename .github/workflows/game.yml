name: Game on the engine

# The build of another game made on this engine (docs/GAME_PACKS.md). A game
# pack's repository calls it from its own workflow (tools/packs/template/
# .github/workflows/build.yml):
#
#   jobs:
#     game:
#       uses: Saaayurii/ashes-of-eden/.github/workflows/game.yml@main
#
# It checks the engine out at `engine_ref`, lays the calling repository over it
# as content/ (tools/packs/apply_pack.py --copy: Docker cannot follow a link),
# validates the whole game and plays every room of it (game-test), exports the
# Web build to the pack's Pages with the art studio beside it, and publishes the
# studio's data to the pack's `studio-data` branch, so the studio anywhere can
# open the game with ?game=owner/name.
#
# The caller grants `contents: write` (the studio-data branch) and, for Pages,
# `pages: write` + `id-token: write`, and turns Pages on (Settings → Pages →
# Source: GitHub Actions).

on:
  workflow_call:
    inputs:
      engine_repository:
        type: string
        default: Saaayurii/ashes-of-eden
      engine_ref:
        type: string
        default: main
      deploy_pages:
        description: export the Web build and serve it on the pack's Pages
        type: boolean
        default: true
      studio_data:
        description: publish the studio's data to the studio-data branch
        type: boolean
        default: true

concurrency:
  group: game-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, play, export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: The game pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: The engine
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: engine

      - name: Lay the pack over the engine
        run: python3 engine/tools/packs/apply_pack.py pack --copy

      # A pack's rooms are its tables (rooms/rooms.json, rooms/composed_rooms.json,
      # and what the studio adds in rooms/studio_rooms.json) over the engine's
      # rooms: the scenes are written from them against this engine
      # (tools/rooms/generate_rooms.py --pack). On a push the pack gets them back
      # as a commit, so a studio pull request needs no generator of its own.
      - name: The pack's rooms, from its tables
        if: hashFiles('pack/rooms/*.json') != ''
        run: |
          set -eu
          python3 -m pip install --quiet numpy pillow
          (cd engine && python3 tools/rooms/generate_rooms.py --pack)
          rsync -a --delete engine/content/scenes/rooms/ pack/scenes/rooms/
          if [ -d engine/content/assets/levels/composed ]; then
            mkdir -p pack/assets/levels/composed
            rsync -a engine/content/assets/levels/composed/ pack/assets/levels/composed/
          fi
          cd pack
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            if [ "${GITHUB_EVENT_NAME}" = push ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A scenes/rooms assets/levels
              git commit -qm "Rooms written from rooms/*.json (engine ${{ inputs.engine_ref }})"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            else
              echo "::warning::scenes/rooms differ from what rooms/*.json write; the push to ${GITHUB_REF_NAME} will commit them"
            fi
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build Godot image (cached)
        uses: docker/build-push-action@v6
        with:
          context: engine
          load: true
          tags: ashes-of-eden/godot:4.7.2
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Validate the game and play every room
        working-directory: engine
        run: docker compose run --rm godot game-test

      - name: Export Web
        if: inputs.deploy_pages
        working-directory: engine
        run: |
          set -eu
          docker compose run --rm build build Web
          test -f build/web/index.html
          big=$(find build/web -type f -size +99M | head -1 || true)
          if [ -n "$big" ]; then echo "::error::$big is over 100 MB — GitHub Pages will reject it."; exit 1; fi

      # The studio's data: the game as the pack makes it (tools/packs/game_view.py).
      # The engine's pictures are read from the engine's commit, the pack's own
      # (content/…) from this one, both on raw.githubusercontent.
      - name: Build the studio's data
        if: inputs.studio_data || inputs.deploy_pages
        working-directory: engine
        run: |
          set -eux
          python3 -m pip install --quiet pillow
          engine_sha=$(git rev-parse HEAD)
          pack_sha=$(git -C ../pack rev-parse HEAD)  # the rooms' commit, when there was one
          python3 tools/studio/build_data.py \
            --asset-base "https://raw.githubusercontent.com/${{ inputs.engine_repository }}/${engine_sha}/" \
            --content-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${pack_sha}/" \
            --engine-repo "${{ inputs.engine_repository }}" \
            --repo "${GITHUB_REPOSITORY}" --content-sha "${pack_sha}" --branch "${GITHUB_REF_NAME}" --sha "${engine_sha}" \
            --out "$RUNNER_TEMP/studio-data"

      - name: Publish it to the studio-data branch
        if: inputs.studio_data
        working-directory: pack
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/branch"
          cd "$RUNNER_TEMP/branch"
          git checkout --orphan studio-data
          git rm -rfq . || true
          cp -r "$RUNNER_TEMP/studio-data/." .
          echo "Built from ${GITHUB_SHA} by the engine's game.yml — do not edit; read by the art studio (?game=${GITHUB_REPOSITORY})." > README.md
          git add -A
          git commit -qm "studio data for ${GITHUB_SHA}"
          git push -f origin studio-data

      - name: Add the art studio and its sandbox
        if: inputs.deploy_pages
        working-directory: engine
        run: |
          set -eux
          sudo mkdir -p build/web/studio/import
          sudo cp -r tools/studio/index.html tools/studio/lib.js tools/studio/repo.js tools/studio/js tools/studio/refs build/web/studio/
          sudo cp -r "$RUNNER_TEMP/studio-data/." build/web/studio/import/
          python3 tools/studio/make_preview_page.py --live build/web/index.html | sudo tee build/web/studio-live.html >/dev/null
          sudo rm -f build/web/.gdignore

      - name: Upload
        if: inputs.deploy_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/build/web

  deploy:
    name: Deploy
    if: inputs.deploy_pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
