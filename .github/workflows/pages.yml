name: Web build on Pages

# The playable build, rebuilt from main and served at
# https://saaayurii.github.io/ashes-of-eden/
#
# This works on Pages only because the Web preset has variant/thread_support
# off (export_presets.cfg). With threads on, Godot needs SharedArrayBuffer,
# which needs the Cross-Origin-Opener-Policy and -Embedder-Policy headers,
# and Pages does not let you set headers at all. If threads are ever turned
# back on, this job stops producing a page that boots and the build has to
# move somewhere that can send headers (itch.io, a host of our own) — see
# tools/docker/nginx.conf for what those headers are.

on:
  push:
    branches: [main]
    # Nothing here changes the build, and the export is the slow part.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/itch.yml"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/generators.yml"
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one but never
# interrupts a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Godot image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ashes-of-eden/godot:4.7.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate data & localization
        run: docker compose run --rm validate

      - name: Export Web
        run: docker compose run --rm build build Web

      - name: Check the export is there and fits
        run: |
          set -eu
          test -f build/web/index.html
          test -f build/web/index.pck
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          du -h build/web/* | sort -rh | head -10 >> "$GITHUB_STEP_SUMMARY"
          # Pages refuses a single file over 100 MB and a site over 1 GB.
          big=$(find build/web -type f -size +99M | head -1 || true)
          if [ -n "$big" ]; then
            echo "::error::$big is over 100 MB — GitHub Pages will reject it."
            echo "Trim the Web preset's exclude_filter (export_presets.cfg)."
            exit 1
          fi

      # What search engines and phones ask for beside the game (robots.txt,
      # sitemap.xml, manifest, icons, the link preview, verification files):
      # tools/web/make_site.py writes them, docs/SEO.md says why.
      - name: Add the site files
        # build/web was written by the container, as root.
        run: |
          set -eux
          sudo cp -r tools/web/site/. build/web/
          sudo rm -f build/web/.gdignore
          ls build/web

      # The art studio (tools/studio/README.md) is served beside the game at
      # /studio/. Its data is built from this commit, and the pictures and
      # sounds it shows are read from the same commit on raw.githubusercontent
      # (they are not copied: Pages would carry the whole assets folder twice).
      - name: Add the art studio
        run: |
          set -eux
          python3 -m pip install --quiet pillow
          python3 tools/studio/build_data.py --asset-base "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/" --sha "${GITHUB_SHA}"
          sudo mkdir -p build/web/studio
          sudo cp -r tools/studio/index.html tools/studio/lib.js tools/studio/repo.js tools/studio/refs tools/studio/import build/web/studio/

      # The browser needs to know what a .pck and a .wasm are; Pages gets this
      # right for .wasm and serves .pck as octet-stream, which is what we want.
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
