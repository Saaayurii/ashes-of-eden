name: Mobile builds

# Android and iOS, built on demand and attached to a tag's release.
#
# Neither is a store build.
#
# Android comes out debug-signed with the keystore baked into the build image
# — installable with `adb install -r`, fine for testing, rejected by Play.
# A Play upload needs your own keystore (docs/RELEASE.md).
#
# iOS comes out UNSIGNED, because signing needs a paid Apple Developer
# account, a certificate and a provisioning profile, none of which live in
# this repository. What the job produces is the .app that Xcode built, which
# is enough to prove the export works and to load on a device yourself via
# Xcode, and is not enough for TestFlight or the App Store. When there is an
# account, add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
# APPLE_PROVISIONING_PROFILE / APPLE_TEAM_ID as secrets and the archive step
# below turns into a real signed export.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    name: Android (debug-signed APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Godot image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ashes-of-eden/godot:4.7.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Plain docker build, not buildx: this image is FROM the one above, and
      # a buildx builder cannot see an image that only exists in the local
      # daemon — it tries to pull ashes-of-eden/godot from Docker Hub and is
      # told, correctly, that no such repository exists.
      #
      # Building it accepts Google's Android SDK licence, as the Dockerfile says.
      # It is a separate image so the everyday CI stays small.
      - name: Build Android image (JDK + SDK + debug keystore)
        run: |
          docker build -f tools/docker/Dockerfile.android \
            -t ashes-of-eden/godot-android:4.7.2 .

      # With an upload keystore in the secrets this is a store-ready build;
      # without one it is debug-signed, which installs over adb and which Play
      # refuses (docs/RELEASE.md).
      - name: Export APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          mode=build-debug
          extra=""
          if [ -n "${KEYSTORE:-}" ]; then
            echo "$KEYSTORE" | base64 -d > upload.jks
            mode=build
            extra="-e GODOT_ANDROID_KEYSTORE=/project/upload.jks \
                   -e GODOT_ANDROID_KEYSTORE_PASS=$KEYSTORE_PASSWORD \
                   -e GODOT_ANDROID_KEY_ALIAS=$KEY_ALIAS \
                   -e GODOT_ANDROID_KEY_PASS=$KEY_PASSWORD"
            echo "### Android — signed with the upload key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android — debug-signed (no ANDROID_KEYSTORE secret)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/project" $extra --entrypoint bash \
            ashes-of-eden/godot-android:4.7.2 -c \
            "cp /project/tools/docker/entrypoint.sh /usr/local/bin/entrypoint \
             && chmod +x /usr/local/bin/entrypoint && entrypoint $mode Android"
          rm -f upload.jks

      - name: Report
        run: |
          set -eu
          test -f build/android/ashes-of-eden.apk
          { echo "### Android"; du -h build/android/*.apk; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ashes-of-eden-android-debug
          path: build/android/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Godot refuses to export for iOS at all without an App Store Team ID —
      # not even the Xcode project on its own, which is all this job wants.
      # A Team ID comes with a paid Apple Developer account and belongs to
      # whoever holds it, so there is none in this repository and none can be
      # invented. Until the secret exists the job says so and stops; it is not
      # a failure, it is a thing that cannot be done from here.
      - name: Is there an Apple account to build against?
        id: gate
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${TEAM_ID:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            {
              echo "### iOS — skipped"
              echo
              echo "No \`APPLE_TEAM_ID\` secret. Godot cannot export for iOS without"
              echo "an App Store Team ID, which needs a paid Apple Developer account."
              echo "Add the secret and this job builds the unsigned app; add"
              echo "\`APPLE_CERTIFICATE\`, \`APPLE_CERTIFICATE_PASSWORD\` and"
              echo "\`APPLE_PROVISIONING_PROFILE\` too and it can be signed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.have == 'true'

      - name: Install Godot and its iOS export templates
        if: steps.gate.outputs.have == 'true'
        env:
          GODOT_VERSION: 4.7.2
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Import and validate
        if: steps.gate.outputs.have == 'true'
        run: |
          set -eux
          "$GODOT" --headless --import --quit || true
          "$GODOT" --headless -s scripts/tools/validate_data.gd

      # Without a signing identity Godot cannot produce an .ipa, so the preset
      # has export_project_only and xcodebuild takes it from there. Godot still
      # wants an App Store Team ID even for that, and there is none in this
      # repository, so an empty one is written into the preset for the length
      # of this job. APPLE_TEAM_ID as a secret replaces it once there is an
      # account; nothing signed comes out of this either way.
      - name: Export the Xcode project
        if: steps.gate.outputs.have == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eux
          mkdir -p build/ios
          if [ -n "${TEAM_ID:-}" ]; then
            sed -i '' "s|^application/app_store_team_id=.*|application/app_store_team_id=\"${TEAM_ID}\"|" export_presets.cfg
          fi
          "$GODOT" --headless --export-release iOS build/ios/ashes-of-eden.ipa
          ls -la build/ios

      - name: Build unsigned
        if: steps.gate.outputs.have == 'true'
        run: |
          set -eux
          cd build/ios
          project=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          test -n "$project"
          xcodebuild -project "$project" -scheme "$(basename "$project" .xcodeproj)" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath dd \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
          find dd -name "*.app" -maxdepth 6 -print

      - name: Package
        if: steps.gate.outputs.have == 'true'
        run: |
          set -eux
          app=$(find build/ios/dd -name "*.app" -maxdepth 6 | head -1)
          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          cd out && zip -qry ../ashes-of-eden-ios-unsigned.ipa Payload
          cd .. && ls -la ashes-of-eden-ios-unsigned.ipa
          { echo "### iOS (unsigned)"; du -h ashes-of-eden-ios-unsigned.ipa; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.have == 'true'
        with:
          name: ashes-of-eden-ios-unsigned
          path: ashes-of-eden-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload
        run: |
          set -eux
          find dist -type f \( -name "*.apk" -o -name "*.ipa" \) -print
          # release.yml makes the release; it may still be exporting.
          for i in $(seq 1 60); do
            gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "${GITHUB_REF_NAME}" \
            $(find dist -type f \( -name "*.apk" -o -name "*.ipa" \)) --clobber \
            --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
