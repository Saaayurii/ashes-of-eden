name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate data & localization
    runs-on: ubuntu-latest
    # Ordinary insurance: GitHub otherwise lets a stuck job hold a runner for
    # six hours. The whole job takes about fifteen minutes when the image has
    # to be rebuilt from scratch, so this is generous and still finite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Godot image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ashes-of-eden/godot:4.7.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate data & localization
        run: docker compose run --rm validate

      - name: Smoke test game loop
        # It plays the whole chapter at 4x and lands around two minutes;
        # twelve is a slow runner, not a stuck one.
        timeout-minutes: 12
        run: docker compose run --rm test

      - name: Crossplay stand (co-op and duel)
        # Two Godot processes finding each other over a socket — the most
        # likely place for this to stick, even though it has not yet. Around
        # two minutes in practice.
        timeout-minutes: 12
        run: docker compose run --rm net-test

      # Half the repository is written by scripts that promise byte-identical
      # output. Only the quick ones here: the audio generators take minutes and
      # the font one downloads 25 MB, so those are for `--all` by hand.
      - name: Generators still reproduce what is committed
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/check_generators.py
