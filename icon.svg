<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#17141b"/>
  <!-- halo -->
  <rect x="5" y="2" width="6" height="1" fill="#e8c86a"/>
  <rect x="4" y="3" width="1" height="1" fill="#e8c86a"/>
  <rect x="11" y="3" width="1" height="1" fill="#e8c86a"/>
  <!-- figure -->
  <rect x="7" y="4" width="2" height="2" fill="#ebdfb2"/>
  <rect x="6" y="6" width="4" height="5" fill="#ebdfb2"/>
  <rect x="6" y="11" width="1" height="3" fill="#ebdfb2"/>
  <rect x="9" y="11" width="1" height="3" fill="#ebdfb2"/>
  <!-- left wing: light -->
  <rect x="2" y="5" width="4" height="1" fill="#e8c86a"/>
  <rect x="1" y="6" width="5" height="1" fill="#e8c86a"/>
  <rect x="2" y="7" width="4" height="1" fill="#e8c86a"/>
  <rect x="3" y="8" width="3" height="1" fill="#e8c86a"/>
  <!-- right wing: dark -->
  <rect x="10" y="5" width="4" height="1" fill="#7a2c3c"/>
  <rect x="10" y="6" width="5" height="1" fill="#7a2c3c"/>
  <rect x="10" y="7" width="4" height="1" fill="#7a2c3c"/>
  <rect x="10" y="8" width="3" height="1" fill="#7a2c3c"/>
</svg>
